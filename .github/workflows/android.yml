name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.4.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Use the lightweight custom template if it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/tpl"
          if gh release download templates --pattern android_release.apk --dir "$RUNNER_TEMP/tpl" 2>/dev/null; then
            sed -i "s#custom_template/release=\"\"#custom_template/release=\"$RUNNER_TEMP/tpl/android_release.apk\"#" export_presets.cfg
            echo "Custom lightweight template in use"
            ls -lh "$RUNNER_TEMP/tpl"
          else
            echo "No custom template: using the official one"
          fi

      - name: Configure Godot for Android export
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/befree.apk
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: befree-apk
          path: build/befree.apk

      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/befree.apk \
            --title "BeFree - dernier build" \
            --notes "APK Android (release allégé, signé avec une clé de test) généré automatiquement depuis le dernier commit de main." \
            --target "$GITHUB_SHA"
